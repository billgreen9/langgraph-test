# 高精度匹配配置。intent_config 中已有的 key 不会被覆盖。
# 精排分 > score_limit 才过线；> llm_skip 则本层不调 LLM 直接命中。

rank_top_k: 5
keyword_top_k: 20
semantic_top_k: 20
rerank_top_n: 8
rrf_k: 60

score_limit_by_level:
  1: 0.45
  2: 0.40
  3: 0.35
  4: 0.30

llm_skip_by_level:
  1: 0.78
  2: 0.74
  3: 0.70
  4: 0.66

atomic_score_limit: 0.82

forbid_score_limit: 0.55
forbid_llm_skip: 0.82

